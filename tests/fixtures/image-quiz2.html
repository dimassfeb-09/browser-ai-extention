<!doctype html>
<html>
<head><meta charset="utf-8"><title>Image Quiz 2</title></head>
<body>
  <h1>Quiz 2</h1>
  <p>Read both math questions in the image and answer each one.</p>
  <!-- Both questions AND all option values exist ONLY as pixels of
       this image. The DOM carries bare letter buttons; each button's
       aria-label says which question it belongs to (Q1/Q2) so the
       snapshot can tell the two groups apart — no numbers anywhere. -->
  <img id="qimg" alt="" width="920" height="600">
  <div>Q1:
    <button class="opt" data-q="1" data-letter="A" aria-label="Q1 option A">A</button>
    <button class="opt" data-q="1" data-letter="B" aria-label="Q1 option B">B</button>
    <button class="opt" data-q="1" data-letter="C" aria-label="Q1 option C">C</button>
    <button class="opt" data-q="1" data-letter="D" aria-label="Q1 option D">D</button>
  </div>
  <div>Q2:
    <button class="opt" data-q="2" data-letter="A" aria-label="Q2 option A">A</button>
    <button class="opt" data-q="2" data-letter="B" aria-label="Q2 option B">B</button>
    <button class="opt" data-q="2" data-letter="C" aria-label="Q2 option C">C</button>
    <button class="opt" data-q="2" data-letter="D" aria-label="Q2 option D">D</button>
  </div>
  <div>Q1 state: <span id="s1">none</span></div>
  <div>Q2 state: <span id="s2">none</span></div>
  <div>Verdict: <span id="verdict">pending</span></div>
  <script>
    const c = document.createElement('canvas');
    c.width = 920;
    c.height = 600;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, 920, 600);
    g.fillStyle = '#111111';
    g.font = '34px monospace';
    g.fillText('Q1: 3/4 + 1/2 = ?', 40, 70);
    g.font = '30px monospace';
    g.fillText('A. 4/6', 60, 160);
    g.fillText('B. 5/4', 480, 160);
    g.fillText('C. 2/6', 60, 240);
    g.fillText('D. 7/4', 480, 240);
    g.font = '34px monospace';
    g.fillText('Q2: ( 24 / 6 ) + ( 7 x 3 ) = ?', 40, 350);
    g.font = '30px monospace';
    g.fillText('A. 23', 60, 440);
    g.fillText('B. 27', 480, 440);
    g.fillText('C. 25', 60, 520);
    g.fillText('D. 31', 480, 520);
    document.getElementById('qimg').src = c.toDataURL('image/png');

    // Q1 correct: B (5/4). Q2 correct: C (25).
    const expected = { 1: 'B', 2: 'C' };
    const answered = { 1: null, 2: null };
    document.querySelectorAll('.opt').forEach((b) => {
      b.addEventListener('click', () => {
        const q = b.dataset.q;
        answered[q] = b.dataset.letter;
        document.getElementById('s' + q).textContent = 'answered:' + b.dataset.letter;
        if (answered[1] && answered[2]) {
          document.getElementById('verdict').textContent =
            answered[1] === expected[1] && answered[2] === expected[2] ? 'correct' : 'wrong';
        }
      });
    });
  </script>
</body>
</html>
