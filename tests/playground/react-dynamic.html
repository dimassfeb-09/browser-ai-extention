<!doctype html>
<!-- Real React: dynamic list + modal form rendered conditionally. -->
<html lang="en">
  <head><meta charset="UTF-8" /><title>Playground — React dynamic + modal</title>
    <style>.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4)}.modal{background:#fff;margin:10vh auto;padding:16px;width:300px}</style>
  </head>
  <body>
    <h1>React — Items</h1>
    <div id="root"></div>
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script>
      const { useState } = React;
      const e = React.createElement;
      function App() {
        const [items, setItems] = useState([]);
        const [open, setOpen] = useState(false);
        const [draft, setDraft] = useState({ name: '', qty: '' });
        return e('div', null,
          e('button', { onClick: () => setOpen(true) }, 'Tambah Item'),
          e('ul', { id: 'items' }, items.map((it, i) => e('li', { key: i }, `${it.name} x${it.qty}`))),
          e('div', { id: 'count' }, `Total: ${items.length} item`),
          open
            ? e('div', { className: 'overlay' },
                e('div', { className: 'modal' },
                  e('div', null,
                    e('label', { htmlFor: 'm-name' }, 'Nama Item'),
                    e('input', { id: 'm-name', type: 'text', value: draft.name, onChange: (ev) => setDraft((d) => ({ ...d, name: ev.target.value })) })),
                  e('div', null,
                    e('label', { htmlFor: 'm-qty' }, 'Qty'),
                    e('input', { id: 'm-qty', type: 'number', value: draft.qty, onChange: (ev) => setDraft((d) => ({ ...d, qty: ev.target.value })) })),
                  e('button', {
                    onClick: () => {
                      setItems((list) => [...list, draft]);
                      setDraft({ name: '', qty: '' });
                      setOpen(false);
                    },
                  }, 'Simpan'),
                  e('button', { onClick: () => setOpen(false) }, 'Batal')))
            : null,
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>
